spring.application.name=marshall-tech
server.port=8080

app.public-url=https://marshallin.in

spring.datasource.url=jdbc:h2:file:./data/marshalltech;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Leave the console off on any machine that is reachable from the network.
# Set this to true only on your own computer, then open /h2
# with JDBC URL jdbc:h2:file:./data/marshalltech and user sa.
spring.h2.console.enabled=false

spring.thymeleaf.cache=false
server.error.include-message=never
server.error.include-binding-errors=never
